<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nguyen Huy Hoang profile artwork</title>
  <desc id="desc">An asymmetric dark editorial banner for an AI engineering GitHub profile.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1110"/>
      <stop offset="0.56" stop-color="#111816"/>
      <stop offset="1" stop-color="#081210"/>
    </linearGradient>
    <linearGradient id="thread" x1="154" y1="414" x2="1042" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DDE7DF" stop-opacity="0.12"/>
      <stop offset="0.42" stop-color="#2DD4BF" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#F3D7A6" stop-opacity="0.72"/>
    </linearGradient>
    <radialGradient id="signal" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(990 250) rotate(132) scale(276 182)">
      <stop stop-color="#2DD4BF" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#2DD4BF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#DDE7DF" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="520" rx="34" fill="url(#paper)"/>
  <rect width="1280" height="520" rx="34" fill="url(#grid)"/>
  <rect x="682" y="34" width="542" height="452" rx="30" fill="url(#signal)"/>

