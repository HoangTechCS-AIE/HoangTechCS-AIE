  <path d="M 12 12 L 12 28 M 12 12 L 28 12" class="l-line"/>
  <path d="M 1188 12 L 1188 28 M 1188 12 L 1172 12" class="l-line"/>
  <path d="M 12 128 L 12 112 M 12 128 L 28 128" class="l-line"/>
  <path d="M 1188 128 L 1188 112 M 1188 128 L 1172 128" class="l-line"/>
