<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" role="img" aria-label="NHH-005 Channels header">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
    .pri { fill: #DDE7DF; }
    .mute { fill: #6F837A; }
    .dim { fill: #4A5A52; }
    .teal { fill: #9CE7DA; }
    .warm { fill: #F3D7A6; }
    .l-faint { stroke: #1F2A26; stroke-width: 1; }
    .l-line { stroke: #2A3B35; stroke-width: 1; }
    .l-teal { stroke: #9CE7DA; stroke-width: 1; }
  </style>
  <defs>
    <pattern id="g5" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#1A2521"/>
    </pattern>
  </defs>

  <rect width="1200" height="140" fill="#0B1110"/>
  <rect width="1200" height="140" fill="url(#g5)"/>

  <circle cx="40" cy="32" r="3" fill="#9CE7DA"/>
  <text x="56" y="36" class="mono mute" font-size="11" letter-spacing="1.2">NHH-005 :: CHANNELS / NETWORK ENDPOINTS</text>
  <text x="1160" y="36" class="mono dim" font-size="11" text-anchor="end" letter-spacing="1.2">4 ACTIVE · 1 PRIMARY</text>
  <line x1="40" y1="54" x2="1160" y2="54" class="l-faint" stroke-dasharray="2,4"/>

  <text x="56" y="100" class="mono pri" font-size="34" font-weight="600" letter-spacing="-1">CHANNELS</text>
  <line x1="56" y1="116" x2="200" y2="116" class="l-teal"/>
  <text x="220" y="100" class="mono mute" font-size="13">reachable via facebook · instagram · codeforces · leetcode</text>

  <!-- right: 4 endpoint markers -->
  <g transform="translate(960, 90)">
    <line x1="0" y1="0" x2="200" y2="0" class="l-faint"/>
    <g>
      <circle cx="20" cy="0" r="5" class="l-teal" fill="#0B1110"/>
      <text x="20" y="20" class="mono dim" font-size="9" text-anchor="middle">01</text>
    </g>
    <g>
      <circle cx="80" cy="0" r="5" class="l-teal" fill="#0B1110"/>
      <text x="80" y="20" class="mono dim" font-size="9" text-anchor="middle">02</text>
    </g>
    <g>
      <circle cx="140" cy="0" r="5" class="l-teal" fill="#0B1110"/>
      <text x="140" y="20" class="mono dim" font-size="9" text-anchor="middle">03</text>
    </g>
    <g>
      <circle cx="200" cy="0" r="5" fill="#F3D7A6"/>
      <text x="200" y="20" class="mono dim" font-size="9" text-anchor="middle">04</text>
    </g>
