<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="NHH-003 Stack manifest">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
    .pri { fill: #DDE7DF; }
    .mute { fill: #6F837A; }
    .dim { fill: #4A5A52; }
    .teal { fill: #9CE7DA; }
    .warm { fill: #F3D7A6; }
    .l-faint { stroke: #1F2A26; stroke-width: 1; }
    .l-line { stroke: #2A3B35; stroke-width: 1; }
    .chip { fill: #0F1715; stroke: #2A3B35; stroke-width: 1; }
    .chip-pri { fill: #0F1715; stroke: #9CE7DA; stroke-width: 1; }
    .chip-warm { fill: #0F1715; stroke: #F3D7A6; stroke-width: 1; }
  </style>
  <defs>
    <pattern id="g3" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#1A2521"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#0B1110"/>
  <rect width="1200" height="420" fill="url(#g3)"/>

  <!-- header -->
  <circle cx="40" cy="32" r="3" fill="#9CE7DA"/>
  <text x="56" y="36" class="mono mute" font-size="11" letter-spacing="1.2">NHH-003 :: STACK / COMPONENT MANIFEST</text>
  <text x="1160" y="36" class="mono dim" font-size="11" text-anchor="end" letter-spacing="1.2">3 BAYS · 10 COMPONENTS</text>
  <line x1="40" y1="54" x2="1160" y2="54" class="l-faint" stroke-dasharray="2,4"/>

  <!-- BAY A — LANGUAGE -->
  <g>
    <text x="56" y="94" class="mono teal" font-size="11" letter-spacing="1.6">BAY A · LANGUAGE</text>
    <line x1="56" y1="106" x2="380" y2="106" class="l-faint"/>
    <rect x="56" y="118" width="324" height="220" fill="none" class="l-faint" stroke-dasharray="3,4"/>
    <!-- corner ticks -->
    <line x1="56" y1="118" x2="68" y2="118" class="l-line"/>
    <line x1="56" y1="118" x2="56" y2="130" class="l-line"/>
    <line x1="368" y1="118" x2="380" y2="118" class="l-line"/>
    <line x1="380" y1="118" x2="380" y2="130" class="l-line"/>
    <line x1="56" y1="338" x2="68" y2="338" class="l-line"/>
    <line x1="56" y1="326" x2="56" y2="338" class="l-line"/>
    <line x1="368" y1="338" x2="380" y2="338" class="l-line"/>
    <line x1="380" y1="326" x2="380" y2="338" class="l-line"/>

    <!-- chip: C -->
    <rect x="76" y="146" width="92" height="48" class="chip"/>
    <text x="84" y="162" class="mono dim" font-size="9" letter-spacing="0.6">01</text>
    <text x="122" y="178" class="mono pri" font-size="15" text-anchor="middle">C</text>
    <circle cx="160" cy="186" r="2" fill="#9CE7DA"/>
    <!-- chip: C++ -->
    <rect x="180" y="146" width="92" height="48" class="chip"/>
    <text x="188" y="162" class="mono dim" font-size="9" letter-spacing="0.6">02</text>
    <text x="226" y="178" class="mono pri" font-size="15" text-anchor="middle">C++</text>
    <circle cx="264" cy="186" r="2" fill="#9CE7DA"/>
    <!-- chip: Python (primary, teal stroke) -->
    <rect x="284" y="146" width="92" height="48" class="chip-pri"/>
    <text x="292" y="162" class="mono dim" font-size="9" letter-spacing="0.6">03</text>
    <text x="330" y="178" class="mono teal" font-size="15" text-anchor="middle">Python</text>
    <circle cx="368" cy="186" r="2" fill="#9CE7DA"/>

    <!-- footer label -->
    <text x="76" y="220" class="mono dim" font-size="10" letter-spacing="0.6">systems &amp; daily driver</text>
    <text x="76" y="316" class="mono dim" font-size="9" letter-spacing="1.6" opacity="0.7">— LANG / BAY-A —</text>
  </g>

  <!-- BAY B — MODELS & DATA -->
  <g>
    <text x="400" y="94" class="mono teal" font-size="11" letter-spacing="1.6">BAY B · MODELS &amp; DATA</text>
    <line x1="400" y1="106" x2="820" y2="106" class="l-faint"/>
    <rect x="400" y="118" width="420" height="220" fill="none" class="l-faint" stroke-dasharray="3,4"/>
    <line x1="400" y1="118" x2="412" y2="118" class="l-line"/>
    <line x1="400" y1="118" x2="400" y2="130" class="l-line"/>
    <line x1="808" y1="118" x2="820" y2="118" class="l-line"/>
    <line x1="820" y1="118" x2="820" y2="130" class="l-line"/>
    <line x1="400" y1="338" x2="412" y2="338" class="l-line"/>
    <line x1="400" y1="326" x2="400" y2="338" class="l-line"/>
    <line x1="808" y1="338" x2="820" y2="338" class="l-line"/>
    <line x1="820" y1="326" x2="820" y2="338" class="l-line"/>

    <!-- chip: PyTorch (warm) -->
    <rect x="420" y="146" width="92" height="48" class="chip-warm"/>
    <text x="428" y="162" class="mono dim" font-size="9" letter-spacing="0.6">04</text>
    <text x="466" y="178" class="mono warm" font-size="14" text-anchor="middle">PyTorch</text>
    <circle cx="504" cy="186" r="2" fill="#F3D7A6"/>
    <!-- chip: NumPy -->
    <rect x="524" y="146" width="92" height="48" class="chip"/>
    <text x="532" y="162" class="mono dim" font-size="9" letter-spacing="0.6">05</text>
    <text x="570" y="178" class="mono pri" font-size="14" text-anchor="middle">NumPy</text>
    <circle cx="608" cy="186" r="2" fill="#9CE7DA"/>
    <!-- chip: Pandas -->
    <rect x="628" y="146" width="92" height="48" class="chip"/>
    <text x="636" y="162" class="mono dim" font-size="9" letter-spacing="0.6">06</text>
    <text x="674" y="178" class="mono pri" font-size="14" text-anchor="middle">Pandas</text>
    <circle cx="712" cy="186" r="2" fill="#9CE7DA"/>
    <!-- chip: OpenCV -->
    <rect x="732" y="146" width="92" height="48" class="chip"/>
    <text x="740" y="162" class="mono dim" font-size="9" letter-spacing="0.6">07</text>
    <text x="778" y="178" class="mono pri" font-size="14" text-anchor="middle">OpenCV</text>
    <circle cx="816" cy="186" r="2" fill="#9CE7DA"/>

    <!-- bus lines connecting back to bay A -->
    <path d="M 384 170 L 400 170" class="l-faint"/>
    <path d="M 820 170 L 836 170" class="l-faint"/>

    <text x="420" y="220" class="mono dim" font-size="10" letter-spacing="0.6">training · numerics · vision pipeline</text>
    <text x="420" y="316" class="mono dim" font-size="9" letter-spacing="1.6" opacity="0.7">— ML / BAY-B —</text>
  </g>

  <!-- BAY C — TOOLCHAIN -->
  <g>
    <text x="840" y="94" class="mono teal" font-size="11" letter-spacing="1.6">BAY C · TOOLCHAIN</text>
    <line x1="840" y1="106" x2="1144" y2="106" class="l-faint"/>
    <rect x="840" y="118" width="304" height="220" fill="none" class="l-faint" stroke-dasharray="3,4"/>
    <line x1="840" y1="118" x2="852" y2="118" class="l-line"/>
    <line x1="840" y1="118" x2="840" y2="130" class="l-line"/>
    <line x1="1132" y1="118" x2="1144" y2="118" class="l-line"/>
    <line x1="1144" y1="118" x2="1144" y2="130" class="l-line"/>
    <line x1="840" y1="338" x2="852" y2="338" class="l-line"/>
    <line x1="840" y1="326" x2="840" y2="338" class="l-line"/>
    <line x1="1132" y1="338" x2="1144" y2="338" class="l-line"/>
    <line x1="1144" y1="326" x2="1144" y2="338" class="l-line"/>

    <!-- chip: Git -->
    <rect x="860" y="146" width="84" height="48" class="chip"/>
    <text x="868" y="162" class="mono dim" font-size="9" letter-spacing="0.6">08</text>
    <text x="902" y="178" class="mono pri" font-size="15" text-anchor="middle">Git</text>
    <circle cx="936" cy="186" r="2" fill="#9CE7DA"/>
    <!-- chip: Linux -->
    <rect x="956" y="146" width="84" height="48" class="chip"/>
    <text x="964" y="162" class="mono dim" font-size="9" letter-spacing="0.6">09</text>
    <text x="998" y="178" class="mono pri" font-size="15" text-anchor="middle">Linux</text>
    <circle cx="1032" cy="186" r="2" fill="#9CE7DA"/>
    <!-- chip: VS Code -->
    <rect x="1052" y="146" width="84" height="48" class="chip"/>
    <text x="1060" y="162" class="mono dim" font-size="9" letter-spacing="0.6">10</text>
    <text x="1094" y="178" class="mono pri" font-size="13" text-anchor="middle">VS Code</text>
    <circle cx="1128" cy="186" r="2" fill="#9CE7DA"/>

    <text x="860" y="220" class="mono dim" font-size="10" letter-spacing="0.6">versioning · runtime · editor</text>
    <text x="860" y="316" class="mono dim" font-size="9" letter-spacing="1.6" opacity="0.7">— OPS / BAY-C —</text>
  </g>

  <!-- bottom legend -->
  <line x1="40" y1="368" x2="1160" y2="368" class="l-faint" stroke-dasharray="2,4"/>
  <g transform="translate(56, 386)">
    <rect x="0" y="-9" width="14" height="10" class="chip-warm"/>
    <text x="20" y="0" class="mono dim" font-size="10">primary focus</text>
    <rect x="120" y="-9" width="14" height="10" class="chip-pri"/>
    <text x="140" y="0" class="mono dim" font-size="10">daily driver</text>
    <rect x="220" y="-9" width="14" height="10" class="chip"/>
    <text x="240" y="0" class="mono dim" font-size="10">working knowledge</text>
  </g>
  <text x="1160" y="386" class="mono dim" font-size="11" text-anchor="end" letter-spacing="1.6">REV · 2026.05</text>

  <!-- corner ticks -->
  <path d="M 12 12 L 12 28 M 12 12 L 28 12" class="l-line"/>
  <path d="M 1188 12 L 1188 28 M 1188 12 L 1172 12" class="l-line"/>
  <path d="M 12 408 L 12 392 M 12 408 L 28 408" class="l-line"/>
  <path d="M 1188 408 L 1188 392 M 1188 408 L 1172 408" class="l-line"/>
</svg>
