<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="NHH-001 Identity schematic">
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', 'Cascadia Mono', Menlo, Consolas, monospace; }
    .pri { fill: #0B1110; }
    .mute { fill: #535C57; }
    .dim { fill: #8B9590; }
    .teal { fill: #0F766E; }
    .warm { fill: #B45309; }
    .l-faint { stroke: #C7CDC4; stroke-width: 1; }
    .l-line { stroke: #A8B0A8; stroke-width: 1; }
    .l-teal { stroke: #0F766E; stroke-width: 1; }
    .l-warm { stroke: #B45309; stroke-width: 1; }
  </style>
  <defs>
    <pattern id="g1" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#D9DCD7"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" fill="#FAFAF7"/>
  <rect width="1200" height="500" fill="url(#g1)"/>

  <!-- top header strip -->
  <circle cx="40" cy="32" r="3" fill="#0F766E"/>
  <text x="56" y="36" class="mono mute" font-size="11" letter-spacing="1.2">NHH-001 :: IDENTITY-SCHEMATIC / v2.1</text>
  <text x="1160" y="36" class="mono dim" font-size="11" text-anchor="end" letter-spacing="1.2">REV · 2026.05 · HANOI</text>
  <line x1="40" y1="54" x2="1160" y2="54" class="l-faint" stroke-dasharray="2,4"/>

  <!-- LEFT: name block -->
  <g>
    <!-- dimension line above name -->
    <line x1="56" y1="98" x2="56" y2="106" class="l-line"/>
    <line x1="56" y1="102" x2="700" y2="102" class="l-line"/>
    <line x1="700" y1="98" x2="700" y2="106" class="l-line"/>
    <text x="378" y="94" class="mono dim" font-size="10" text-anchor="middle" letter-spacing="2">— DISPLAY / 644u —</text>

    <text x="56" y="210" class="mono pri" font-size="92" font-weight="600" letter-spacing="-4">NGUYEN</text>
    <text x="56" y="304" class="mono pri" font-size="92" font-weight="600" letter-spacing="-4">HUY HOANG</text>

    <!-- accent strap -->
    <line x1="56" y1="338" x2="200" y2="338" class="l-teal"/>
    <text x="56" y="362" class="mono teal" font-size="13" letter-spacing="2.4">AI SYSTEMS · BACKEND · PRODUCT</text>

    <text x="56" y="388" class="mono mute" font-size="12">cs student · hanoi univ. of industry · gmt+7</text>
  </g>

  <!-- RIGHT: convergence schematic -->
  <g transform="translate(770, 96)">
    <!-- frame header -->
    <text x="0" y="14" class="mono dim" font-size="10" letter-spacing="1.6">FN(t) :: CONVERGENCE → PRODUCT</text>
    <line x1="0" y1="28" x2="380" y2="28" class="l-faint" stroke-dasharray="2,3"/>

    <!-- input nodes -->
    <g>
      <circle cx="18" cy="80" r="6" class="l-teal" fill="none"/>
      <text x="36" y="84" class="mono pri" font-size="13">applied ML</text>
      <text x="36" y="100" class="mono dim" font-size="10" letter-spacing="0.6">model · workflows · automation</text>
    </g>
    <g>
      <circle cx="18" cy="140" r="6" class="l-teal" fill="none"/>
      <text x="36" y="144" class="mono pri" font-size="13">backend systems</text>
      <text x="36" y="160" class="mono dim" font-size="10" letter-spacing="0.6">apis · services · data plumbing</text>
    </g>
    <g>
      <circle cx="18" cy="200" r="6" class="l-teal" fill="none"/>
      <text x="36" y="204" class="mono pri" font-size="13">algorithmic discipline</text>
      <text x="36" y="220" class="mono dim" font-size="10" letter-spacing="0.6">codeforces · leetcode · structures</text>
    </g>

    <!-- converging lines -->
    <path d="M 200 80 L 270 140" class="l-teal" fill="none" opacity="0.55"/>
    <path d="M 200 140 L 270 140" class="l-teal" fill="none" opacity="0.55"/>
    <path d="M 200 200 L 270 140" class="l-teal" fill="none" opacity="0.55"/>

    <!-- output node -->
    <circle cx="290" cy="140" r="11" fill="#B45309"/>
    <circle cx="290" cy="140" r="20" class="l-warm" fill="none" opacity="0.4"/>
    <line x1="312" y1="140" x2="360" y2="140" class="l-warm" opacity="0.5"/>
    <text x="362" y="138" class="mono warm" font-size="12">product-minded</text>
    <text x="362" y="154" class="mono warm" font-size="12">engineering</text>

    <!-- right edge tick rail -->
    <line x1="378" y1="60" x2="378" y2="220" class="l-faint"/>
    <line x1="372" y1="80" x2="378" y2="80" class="l-line"/>
    <line x1="372" y1="140" x2="378" y2="140" class="l-line"/>
    <line x1="372" y1="200" x2="378" y2="200" class="l-line"/>
  </g>

  <!-- bottom footer -->
  <line x1="40" y1="436" x2="1160" y2="436" class="l-faint" stroke-dasharray="2,4"/>
  <text x="56" y="462" class="mono mute" font-size="11" letter-spacing="0.6">loc: hanoi/vn  ·  edu: cs / hanoi univ. of industry  ·  aim: senior engineer → technical founder</text>
  <text x="1160" y="462" class="mono teal" font-size="11" text-anchor="end" letter-spacing="2">[ LEARN DEEPLY · BUILD CLEANLY · SHIP USEFULLY ]</text>

  <!-- corner tick marks -->
  <path d="M 12 12 L 12 28 M 12 12 L 28 12" class="l-line"/>
  <path d="M 1188 12 L 1188 28 M 1188 12 L 1172 12" class="l-line"/>
  <path d="M 12 488 L 12 472 M 12 488 L 28 488" class="l-line"/>
  <path d="M 1188 488 L 1188 472 M 1188 488 L 1172 488" class="l-line"/>
</svg>
